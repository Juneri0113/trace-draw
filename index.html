<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>따라 그리기</title>
<style>
:root{--bg:#fff7e8;--card:#fff;--ink:#3a2e22;--accent:#ff7a59;--line:#f0dfc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2320;--card:#3a312c;--ink:#fbeedd;--line:#554840}}
:root[data-theme="dark"]{--bg:#2a2320;--card:#3a312c;--ink:#fbeedd;--line:#554840}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Jua","Noto Sans KR","Malgun Gothic",sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.screen{display:none;height:100%;padding:16px 20px;flex-direction:column}
.screen.on{display:flex}
h1{margin:4px 0 12px;font-size:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;overflow:auto;padding:4px}
.tile{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:22px;min-height:48px;position:relative}
.tile canvas,.tile img{width:100%;aspect-ratio:10/7;border-radius:14px;background:#fff}
.btn{background:var(--card);border:3px solid var(--line);border-radius:999px;min-width:56px;min-height:56px;padding:0 18px;font-size:22px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sp{flex:1}
#wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
#paper{position:relative;aspect-ratio:10/7;max-width:100%;max-height:100%;width:100%;background:#fff;border-radius:20px;border:4px solid var(--line);overflow:hidden;touch-action:none}
#paper canvas{position:absolute;inset:0;width:100%;height:100%}
.tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;justify-content:center}
.sw{width:52px;height:52px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--line)}
.sw.sel{box-shadow:0 0 0 5px var(--ink)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 22px;border-radius:999px;font-size:26px;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
#done{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:5}
#done.on{display:flex}
#done .box{background:var(--card);padding:28px 36px;border-radius:28px;text-align:center}
#done .stars{font-size:56px}
#done .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.bar .btn.pri{transform:scale(1.05)}
#pen{display:none;position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,92vw);background:var(--card);border:3px solid var(--line);border-radius:24px;padding:16px 20px;z-index:20;box-shadow:0 8px 30px #0004;font-size:22px}
#pen.on{display:block}
#pen label{display:block;margin:12px 0}
#pen input[type=range]{width:100%;height:44px;accent-color:var(--accent)}
#pen .ph{display:flex;justify-content:space-between;align-items:center}
#pen .pv{height:70px;display:flex;align-items:center;background:#fff;border-radius:16px;padding:0 20px}
#pen-prev{width:100%;border-radius:999px}
#pen .chk{display:flex;gap:10px;align-items:center}
#pen .chk input{width:28px;height:28px;accent-color:var(--accent)}
.del{position:absolute;top:4px;right:4px;width:48px;height:48px;border-radius:50%;border:0;background:#0006;color:#fff;font-size:22px}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="bar"><h1>🎨 따라 그리기</h1><span class="sp"></span><button class="btn" id="toGallery">🖼️ 내 그림</button></div>
  <div class="bar" id="tabs"></div><div class="grid" id="menu"></div>
</section>

<section id="gallery" class="screen">
  <div class="bar"><button class="btn" id="g-back">⬅ 처음</button><h1>🖼️ 내 그림</h1><span class="sp"></span><button class="btn" id="g-exp">📤 백업</button><button class="btn" id="g-imp">📂 불러오기</button><input type="file" id="g-file" accept=".json,application/json" hidden></div>
  <div class="grid" id="gal"></div>
</section>

<section id="draw" class="screen">
  <div class="bar">
    <button class="btn" id="back">⬅</button>
    <span id="title" style="font-size:26px"></span><span class="sp"></span>
    <button class="btn" id="undo">↩️ 되돌리기</button>
    <button class="btn" id="clear">🗑️ 지우기</button>
    <button class="btn" id="png">📥 그림 내려받기</button>
    <button class="btn pri" id="save">💾 저장</button>
  </div>
  <div id="wrap">
    <div id="paper">
      <canvas id="guide" width="1000" height="700"></canvas>
      <canvas id="cv" width="1000" height="700"></canvas>
      <div class="toast" id="toast"></div>
    </div>
    <div id="done"><div class="box"><div class="stars">⭐⭐⭐</div><h2 style="font-size:32px;margin:6px 0">참 잘했어요!</h2>
      <div class="row"><button class="btn pri" id="d-color">🖍️ 색칠하기</button><button class="btn" id="d-save">💾 저장</button><button class="btn" id="d-home">🏠 다른 그림</button></div></div></div>
  </div>
  <div class="tools" id="tools"></div>
  <div id="pen"><div class="ph"><b>✏️ 펜 설정</b><button class="btn" id="pen-x">✕ 닫기</button></div>
    <label>펜 굵기 <b id="pen-wv"></b><input type="range" id="pen-w" min="2" max="40" step="1"></label>
    <div class="pv"><div id="pen-prev"></div></div>
    <label>지우개 굵기 <b id="pen-ev"></b><input type="range" id="pen-e" min="10" max="100" step="2"></label>
    <label class="chk"><input type="checkbox" id="pen-pr" checked> S Pen을 세게 누르면 굵게</label>
  </div>
</section>

// 도안 선을 손그림처럼 부드럽게 변환
const _svg=document.createElementNS("http://www.w3.org/2000/svg","path");
const nz=(x,y)=>[4*(Math.sin(x*.013+y*.021)+Math.sin(x*.029-y*.012+1.7)),4*(Math.sin(x*.017-y*.019+.6)+Math.sin(x*.011+y*.031+2.9))];
function organic(d){_svg.setAttribute("d",d);const L=_svg.getTotalLength();if(L<40)return d;
 const n=Math.max(8,Math.round(L/9)),k=0;const P=[];
 for(let i=0;i<=n;i++){const q=_svg.getPointAtLength(L*i/n);P.push([q.x,q.y])}
 const closed=/z\s*$/i.test(d)||Math.hypot(P[0][0]-P[n][0],P[0][1]-P[n][1])<3;
 if(closed)P.pop();
 const m=P.length,g=i=>closed?P[(i+m)%m]:P[Math.min(m-1,Math.max(0,i))];
 let Q=P.map((p,i)=>{if(!closed&&(i===0||i===m-1))return p;const a=g(i-1),b=g(i+1);return[(a[0]+2*p[0]+b[0])/4,(a[1]+2*p[1]+b[1])/4]});
 Q=Q.map(p=>{const o=nz(p[0],p[1]);return[p[0]+o[0]*k,p[1]+o[1]*k]});
 const h=i=>closed?Q[(i+m)%m]:Q[Math.min(m-1,Math.max(0,i))];
 const f=v=>v.toFixed(1);let s="M"+f(Q[0][0])+" "+f(Q[0][1]);
 for(let i=0,e=closed?m:m-1;i<e;i++){const a=h(i-1),b=h(i),c=h(i+1),z=h(i+2);
  s+="C"+f(b[0]+(c[0]-a[0])/6)+" "+f(b[1]+(c[1]-a[1])/6)+","+f(c[0]-(z[0]-b[0])/6)+" "+f(c[1]-(z[1]-b[1])/6)+","+f(c[0])+" "+f(c[1])}
 return s+(closed?"Z":"")}
DRAWINGS.forEach(d=>d.strokes=d.strokes.map(organic));
const COLORS=["#222222","#e53935","#ff9800","#fdd835","#43a047","#1e88e5","#8e24aa","#8d6e63","#ec407a"];
const $=id=>document.getElementById(id);
const gc=$("guide").getContext("2d"),cv=$("cv"),ctx=cv.getContext("2d");
let erSize=30,press=true,cur=null,paths=[],samples=[],idx=0,mode="trace",strokes=[],color=COLORS[1],size=12,eraser=false,drawing=null,penSeen=false,fails=0,raf=0,t0=0;

function show(id){$("pen").classList.remove("on");document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));if(id!=="draw")cancelAnimationFrame(raf)}
function thumb(d){const c=document.createElement("canvas");c.width=300;c.height=210;const x=c.getContext("2d");x.scale(.3,.3);x.lineWidth=8;x.strokeStyle="#6f7787";x.lineCap="round";d.strokes.forEach(s=>x.stroke(new Path2D(s)));return c}
function buildMenu(){const tb=$("tabs");tb.innerHTML="";CATS.forEach(c=>{const t=document.createElement("button");t.className="btn"+(c===curCat?" pri":"");t.textContent=c;t.onclick=()=>{curCat=c;buildMenu()};tb.append(t)});const m=$("menu");m.innerHTML="";DRAWINGS.forEach((d,i)=>{if(d.cat!==curCat)return;const b=document.createElement("button");b.className="tile";b.append(thumb(d));b.append(`${d.icon} ${d.name}`);b.onclick=()=>start(i);m.append(b)})}

function sample(s){const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",s);const L=p.getTotalLength(),n=Math.max(10,Math.round(L/16)),a=[];for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);a.push([q.x,q.y])}return a}

function start(i){cur=DRAWINGS[i];paths=cur.strokes.map(s=>new Path2D(s));samples=cur.strokes.map(sample);idx=0;mode="trace";strokes=[];fails=0;$("title").textContent=cur.icon+" "+cur.name;$("done").classList.remove("on");show("draw");redraw();loop()}

function redraw(){ctx.clearRect(0,0,W,H);strokes.forEach(drawStroke)}
function drawStroke(s){ctx.save();ctx.globalCompositeOperation=s.eraser?"destination-out":"source-over";ctx.strokeStyle=s.color;ctx.lineCap=ctx.lineJoin="round";
 if(s.pts.length===1){const p=s.pts[0];ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(p[0],p[1],p[2]/2,0,7);ctx.fill()}
 for(let i=1;i<s.pts.length;i++){const a=s.pts[i-1],b=s.pts[i];ctx.lineWidth=b[2];ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke()}ctx.restore()}

function loop(t){raf=requestAnimationFrame(loop);gc.clearRect(0,0,W,H);gc.lineCap=gc.lineJoin="round";
 if(mode==="free"){gc.setLineDash([]);gc.lineWidth=3.5;gc.strokeStyle="#b4bbc8";paths.forEach(p=>gc.stroke(p));return}
 gc.setLineDash([]);gc.lineWidth=4;gc.strokeStyle="#a9b1bf";for(let i=0;i<idx;i++)gc.stroke(paths[i]);
 if(idx<paths.length){const ph=(t||0)/40;gc.setLineDash([22,16]);gc.lineDashOffset=-ph;gc.lineWidth=6;gc.strokeStyle="#ff7a59";gc.stroke(paths[idx]);gc.setLineDash([]);
  const s=samples[idx][0],r=26+4*Math.sin((t||0)/200);gc.fillStyle="#2eb872";gc.beginPath();gc.arc(s[0],s[1],r,0,7);gc.fill();gc.fillStyle="#fff";gc.font="bold 28px sans-serif";gc.textAlign="center";gc.textBaseline="middle";gc.fillText(idx+1,s[0],s[1]+1)}}

function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function ptr(e){const [x,y]=pos(e);const w=e.pointerType==="pen"&&press?size*(.4+(e.pressure||.5)*1.3):size;return[x,y,eraser?erSize:w]}
cv.addEventListener("pointerdown",e=>{if(e.pointerType==="pen")penSeen=true;if(e.pointerType==="touch"&&penSeen)return;if(drawing)return;cv.setPointerCapture(e.pointerId);drawing={id:e.pointerId,color:color,eraser:eraser&&mode==="free",pts:[ptr(e)],trace:mode==="trace"};drawStroke(drawing)});
cv.addEventListener("pointermove",e=>{if(!drawing||e.pointerId!==drawing.id)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=ptr(ev),l=drawing.pts[drawing.pts.length-1];drawing.pts.push(p);drawStroke({...drawing,pts:[l,p]})})});
const end=e=>{if(!drawing||e.pointerId!==drawing.id)return;const s=drawing;drawing=null;
 if(!s.trace){strokes.push(s);return}
 judge(s)};
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);

function judge(s){const g=samples[idx],pts=s.pts;const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
 const cover=g.filter(q=>pts.some(p=>d(p,q)<38)).length/g.length;
 const prec=pts.filter(p=>g.some(q=>d(p,q)<52)).length/pts.length;
 if((cover>=.75&&prec>=.6)||(fails>=2&&cover>=.5)){s.traceIdx=idx;strokes.push(s);idx++;fails=0;redraw();
  if(idx>=paths.length){setTimeout(()=>$("done").classList.add("on"),350)}else toast(["잘했어요!","멋져요!","좋아요!","최고예요!"][idx%4])}
 else{fails++;redraw();toast("다시 한번! 초록 점에서 시작해요")}}

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1100)}

$("undo").onclick=()=>{const s=strokes.pop();if(!s)return;if(s.traceIdx!==undefined){idx=s.traceIdx;mode="trace"}redraw()};
$("clear").onclick=()=>{strokes=[];idx=0;mode="trace";fails=0;redraw()};
$("back").onclick=()=>show("home");
$("d-color").onclick=()=>{mode="free";$("done").classList.remove("on")};
$("d-home").onclick=()=>show("home");
$("d-save").onclick=()=>{saveImg();$("done").classList.remove("on");mode="free"};
$("save").onclick=saveImg;

function tools(){const t=$("tools");t.innerHTML="";try{penUI()}catch(e){}COLORS.forEach(c=>{const b=document.createElement("button");b.className="sw"+(c===color&&!eraser?" sel":"");b.style.background=c;b.onclick=()=>{color=c;eraser=false;tools()};t.append(b)});
 [[6,"가늘게"],[12,"보통"],[22,"굵게"]].forEach(([n,l])=>{const b=document.createElement("button");b.className="btn";b.style.background=size===n?"var(--line)":"";b.textContent=l;b.onclick=()=>{size=n;tools()};t.append(b)});
 const e=document.createElement("button");e.className="btn";e.textContent="🧽 지우개";e.style.background=eraser?"var(--line)":"";e.onclick=()=>{if(mode!=="free"){toast("색칠 모드에서 쓸 수 있어요")}else{eraser=!eraser;tools()}};t.append(e);const o=document.createElement("button");o.className="btn";o.textContent="⚙️ 펜 설정";o.onclick=()=>$("pen").classList.toggle("on");t.append(o)}

function getGal(){try{return JSON.parse(localStorage.getItem("gal")||"[]")}catch(e){return[]}}
function saveImg(){const c=document.createElement("canvas");c.width=600;c.height=420;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,600,420);x.scale(.6,.6);x.lineCap="round";x.lineWidth=5;x.strokeStyle="#d5d9df";paths.forEach(p=>x.stroke(p));x.drawImage(cv,0,0);
 try{const g=getGal();g.unshift({n:cur.name,i:c.toDataURL("image/jpeg",.78)});localStorage.setItem("gal",JSON.stringify(g.slice(0,60)));toast("저장했어요!")}catch(e){toast("저장할 수 없어요")}}
function showGal(){const g=getGal(),el=$("gal");el.innerHTML="";if(!g.length)el.textContent="아직 저장한 그림이 없어요.";g.forEach((it,k)=>{const d=document.createElement("div");d.className="tile";const im=new Image();im.src=it.i;d.append(im,it.n);const x=document.createElement("button");x.className="del";x.textContent="✕";x.onclick=()=>{g.splice(k,1);try{localStorage.setItem("gal",JSON.stringify(g))}catch(e){}showGal()};d.append(x);const sv=document.createElement("button");sv.className="btn";sv.textContent="📥 내려받기";sv.onclick=()=>dl(it.i,it.n+".jpg");d.append(sv);el.append(d)});show("gallery")}
function dl(u,n){try{const a=document.createElement("a");a.href=u;a.download=n;document.body.append(a);a.click();a.remove()}catch(e){toast("저장할 수 없어요")}}
$("png").onclick=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);x.lineCap="round";x.lineWidth=5;x.strokeStyle="#d5d9df";paths.forEach(p=>x.stroke(p));x.drawImage(cv,0,0);c.toBlob(b=>{const u=URL.createObjectURL(b);dl(u,cur.name+".png");setTimeout(()=>URL.revokeObjectURL(u),4000);toast("그림을 내려받았어요!")})};
$("g-exp").onclick=()=>{const b=new Blob([JSON.stringify(getGal())],{type:"application/json"}),u=URL.createObjectURL(b);dl(u,"my-drawings.json");setTimeout(()=>URL.revokeObjectURL(u),4000)};
$("g-imp").onclick=()=>$("g-file").click();
$("g-file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const inc=JSON.parse(r.result);if(!Array.isArray(inc))throw 0;const g=getGal(),have=new Set(g.map(v=>v.i));const add=inc.filter(v=>v&&typeof v.i==="string"&&v.i.startsWith("data:image/")&&!have.has(v.i)).map(v=>({n:String(v.n||"").slice(0,20),i:v.i}));localStorage.setItem("gal",JSON.stringify([...add,...g].slice(0,60)));showGal()}catch(x){alert("불러올 수 없는 파일이에요")}};r.readAsText(f);e.target.value=""};
function penUI(){const pv=$("pen-prev");pv.style.height=(eraser?erSize:size)+"px";pv.style.background=eraser?"#bbb":color;$("pen-w").value=size;$("pen-e").value=erSize;$("pen-wv").textContent=size;$("pen-ev").textContent=erSize}
$("pen-w").oninput=e=>{size=+e.target.value;eraser=false;tools()};
$("pen-e").oninput=e=>{erSize=+e.target.value;penUI()};
$("pen-pr").onchange=e=>{press=e.target.checked};
$("pen-x").onclick=()=>$("pen").classList.remove("on");
$("toGallery").onclick=showGal;$("g-back").onclick=()=>show("home");
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
buildMenu();tools();
